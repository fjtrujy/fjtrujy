<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Francisco Javier Trujillo — from pixels to platforms</title>
  <desc id="description">A dark technical banner with vibrant turquoise and amber accents, a subtle circuit grid, and a diagram of an application-to-GPU rendering pipeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="0.57" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0d1b31"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e5bb"/>
      <stop offset="1" stop-color="#66cce9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183349"/>
      <stop offset="1" stop-color="#0c2234"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#6dc3ca" stroke-width="0.7" stroke-opacity="0.085"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>
