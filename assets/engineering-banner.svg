    <text x="927" y="184" text-anchor="middle" fill="#a4d8d3" font-family="Menlo, Consolas, monospace" font-size="11">WASM</text>
    <text x="1062" y="161" text-anchor="middle" fill="#f1f8fb" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700">GPU</text>
