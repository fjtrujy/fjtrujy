    <path d="M0 314H550L615 250H690" stroke="#55e5bb" stroke-width="1.5" fill="none" stroke-opacity="0.19"/>
    <circle cx="600" cy="244" r="4" fill="#55e5bb" opacity="0.65"/>
    <circle cx="620" cy="80" r="4" fill="#f8b878" opacity="0.85"/>

    <rect x="68" y="43" width="176" height="27" rx="13.5" fill="#153c46" stroke="#327a7f"/>
    <circle cx="87" cy="56.5" r="4.5" fill="#55e5bb"/>
    <text x="102" y="61.5" fill="#b1f2e5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">ENGINEERING / OSS</text>

    <text x="67" y="135" fill="#f4f8fb" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8">Francisco Javier</text>
    <text x="67" y="203" fill="url(#signal)" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.8">Trujillo.</text>
    <path d="M70 224H580" stroke="#467b87" stroke-width="1.5"/>
    <path d="M70 224H221" stroke="#f8b878" stroke-width="3.5"/>
    <text x="69" y="264" fill="#e1edf4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500">From pixels to platforms.</text>
